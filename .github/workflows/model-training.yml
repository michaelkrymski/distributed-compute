name: Theoretical model checks
on:
  push:
    paths: ["training/**", "hivemind-tools/**", "team-dashboard/**", ".github/workflows/model-training.yml"]
  pull_request:
    paths: ["training/**", "hivemind-tools/**", "team-dashboard/**", ".github/workflows/model-training.yml"]

permissions:
  contents: read

jobs:
  cpu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Check model and data contracts
        run: python -m pytest -q
      - name: Run real two-worker averaging and resume test
        run: python tests/smoke_swarm.py
      - name: Run checkpoint recovery and continued training test
        run: python tests/smoke_checkpoint.py
      - name: Run late-join state transfer test
        run: python tests/smoke_late_join.py

  dashboard-model-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: team-dashboard/package-lock.json
      - name: Install model and dashboard dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './training[test]' -e './hivemind-tools[test]'
          npm --prefix team-dashboard ci --no-audit --no-fund
      - name: Real API and two-worker baseline-model benchmark
        run: |
          cd team-dashboard
          node scripts/create-team-keys.mjs
          npm run build
          for migration in drizzle/*.sql; do
            node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file "$migration"
          done
          npm run dev -- --port 5173 > /tmp/glm-model-backend.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/api/benchmark || true)
            if [ "$status" = 401 ]; then break; fi
            sleep 1
          done
          node tests/api-integration.mjs
          node --experimental-strip-types --test tests/benchmark.test.mjs
          cd ../hivemind-tools
          python tests/e2e_real_backend.py --api http://127.0.0.1:5173 --keys-file ../team-dashboard/work/team-access-keys.json --agents 2 --workload baseline-training --batch-tokens 1024 --warmup 10 --measure 45
          python tests/e2e_real_backend.py --api http://127.0.0.1:5173 --keys-file ../team-dashboard/work/team-access-keys.json --agents 2 --workload baseline-training --training-profile optimized-fp32 --microbatch 4 --batch-tokens 1024 --warmup 10 --measure 45

  desktop-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ./training -e ./hivemind-tools
          npm --prefix team-dashboard ci --no-audit --no-fund
      - name: Actual database, room API and corpus workers
        run: |
          cd team-dashboard
          node scripts/create-team-keys.mjs
          npm run build
          for migration in drizzle/*.sql; do
            node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file "$migration"
          done
          npm run dev -- --port 5181 > /tmp/glm-room-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5181/api/rooms || true)
            if [ "$status" = 401 ]; then break; fi
            sleep 1
          done
          node tests/rooms-integration.mjs
          node tests/servers-integration.mjs
          cd ..
          python desktop/tests/room_cpu_acceptance.py
