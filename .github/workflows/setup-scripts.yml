name: Computer setup scripts
on:
  push:
    paths: ["setup/**", ".github/workflows/setup-scripts.yml"]
  pull_request:
    paths: ["setup/**", ".github/workflows/setup-scripts.yml"]
permissions:
  contents: read
jobs:
  linux-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n setup/linux.sh
      - name: Read-only plans for all supported wheel choices
        run: |
          for device in auto cuda rocm cpu; do
            bash setup/linux.sh --device "$device" --plan
          done
          if bash setup/linux.sh --device invalid --plan; then exit 1; fi
          if bash setup/linux.sh --unknown; then exit 1; fi
  windows-plan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and run only read-only plans
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path setup/windows.ps1), [ref]$null, [ref]$errors)
          if ($errors) { throw ($errors | Out-String) }
          ./setup/windows.ps1 -Plan
          ./setup/windows.ps1 -Plan -Device cpu
          ./setup/windows.ps1 -Plan -Distro Custom-Ubuntu
