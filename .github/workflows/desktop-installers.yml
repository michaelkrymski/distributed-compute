name: Desktop installers
on:
  workflow_dispatch:
  push:
    paths: ["desktop/**", ".github/workflows/desktop-installers.yml"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libinput10 libxkbcommon0 libx11-xcb1 libxcb1 libgbm1 fonts-dejavu-core
      - run: python -m pip install ./desktop pyinstaller
      - run: python desktop/packaging/build.py
      - name: Check packaged Windows UI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ./dist/Distributed-Compute/Distributed-Compute.exe -ArgumentList '--check-ui' -WindowStyle Hidden -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Packaged UI compilation failed' }
      - name: Check packaged Linux UI
        if: runner.os == 'Linux'
        run: ./dist/Distributed-Compute/Distributed-Compute --check-ui
      - name: Windows installer
        if: runner.os == 'Windows'
        run: '& "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DSourceDir=$PWD" /Oinstaller-output desktop/packaging/windows.iss'
      - name: Linux installer bundle
        if: runner.os == 'Linux'
        run: |
          cp desktop/packaging/install-linux.sh dist/install.sh
          chmod +x dist/install.sh
          tar -czf Distributed-Compute-Linux.tar.gz -C dist Distributed-Compute install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Distributed-Compute-${{ runner.os }}
          path: |
            installer-output/*.exe
            desktop/packaging/installer-output/*.exe
            Distributed-Compute-Linux.tar.gz
