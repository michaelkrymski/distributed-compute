name: Hivemind and dashboard integration
on:
  pull_request:
    paths: ["hivemind-tools/**", "team-dashboard/**", "netlify.toml", ".github/workflows/training.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-smoke:
    strategy:
      matrix:
        agents: [1, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hivemind-tools/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: team-dashboard/package-lock.json
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './hivemind-tools[test]'
          npm --prefix team-dashboard ci --no-audit --no-fund
      - name: Unit tests and frontend build
        run: |
          python -m pytest -q hivemind-tools/tests
          cd team-dashboard
          node --test tests/model.test.mjs tests/benchmark.test.mjs
          node node_modules/typescript/bin/tsc --noEmit
          npm run build:frontend
      - name: Real API, local D1, and full six-minute benchmark
        run: |
          cd team-dashboard
          node scripts/create-team-keys.mjs
          npm run build
          for migration in drizzle/*.sql; do
            node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file "$migration"
          done
          npm run dev -- --port 5173 > /tmp/glm-backend.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/api/benchmark || true)
            if [ "$status" = 401 ]; then break; fi
            sleep 1
          done
          node tests/api-integration.mjs
          node tests/auth-integration.mjs
          cd ../hivemind-tools
          python tests/e2e_real_backend.py --api http://127.0.0.1:5173 --keys-file ../team-dashboard/work/team-access-keys.json --agents ${{ matrix.agents }}
