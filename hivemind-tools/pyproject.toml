[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "glm-hivemind-tools"
version = "0.4.0"
description = "Model-independent Hivemind coordination and timed team benchmarks"
requires-python = ">=3.11,<3.13"
dependencies = ["torch==2.8.0", "hivemind==1.1.12"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
glmbench = "glmbench.__main__:main"

[tool.setuptools.packages.find]
include = ["glmbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
